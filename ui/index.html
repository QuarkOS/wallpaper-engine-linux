<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wallpapers</title>
  <link rel="stylesheet" href="ui/styles.css">
</head>
<body>
  <header>
    <h1>Wallpapers</h1>
    <span id="status" role="status" aria-live="polite">Loading your library…</span>
  </header>
  <nav id="controls">
    <button type="button" id="rescan">Rescan Steam</button>
    <form id="add-folder">
      <label for="extra-path">Another Wallpaper Engine folder</label>
      <input id="extra-path" name="path" type="text" autocomplete="off" spellcheck="false">
      <button type="submit">Add folder</button>
    </form>
  </nav>
  <div id="error" role="alert" hidden></div>
  <main id="library"></main>
  <section id="settings">
    <h2>Settings</h2>
    <label for="autostart">Start on login</label>
    <input id="autostart" type="checkbox">
  </section>
  <div id="autostart-prompt" hidden>
    <p id="autostart-question">Start Wallpapers when you log in?</p>
    <button type="button" id="autostart-yes">Yes</button>
    <button type="button" id="autostart-no">No</button>
  </div>
  <script src="ui/app.js" defer></script>
</body>
</html>
