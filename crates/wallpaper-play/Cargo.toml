[package]
name = "wallpaper-play"
version = "0.1.0"
edition = "2021"
description = "Plan and launch the first video or web wallpaper in a Steam workshop library."
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wallpaper-import = { path = "../wallpaper-import" }

[dev-dependencies]
serde_json = "1"
